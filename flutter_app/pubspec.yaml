name: flutter_app
description: "Self-Study Library Management System Mobile Application (Flutter)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.0
  workmanager: ^0.10.10
  geolocator: ^12.0.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/studyspace/
    - assets/branding/library_abc/
    - assets/branding/library_xyz/
