plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.flutter_app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Default base application ID
        applicationId = "com.example.flutter_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resValue "string", "app_name", "StudySpace"
    }

    flavorDimensions "default"

    productFlavors {
        studyspace {
            dimension "default"
            applicationId "com.studyspace.lib001"
            resValue "string", "app_name", "StudySpace LIB001"
        }
        lib001 {
            dimension "default"
            applicationId "com.studyspace.lib001"
            resValue "string", "app_name", "StudySpace LIB001"
        }
        lib002 {
            dimension "default"
            applicationId "com.studyspace.lib002"
            resValue "string", "app_name", "StudySpace LIB002"
        }
        superadmin {
            dimension "default"
            applicationId "com.studyspace.superadmin"
            resValue "string", "app_name", "StudySpace Super Admin"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source = "../.."
}
